<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .custom-shadow {
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.04),
          0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body class="flex items-center justify-center">
    <div
      class="w-[360px] bg-bg-main custom-shadow rounded-xl overflow-hidden border border-border-defined"
    >
      <header class="flex items-center justify-between px-5 py-4 border-b border-border-defined bg-white">
        <div class="flex items-center gap-2.5">
          <div class="bg-primary p-1.5 rounded-lg flex items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-white text-[20px]">shield_lock</span>
          </div>
          <h2 class="text-text-charcoal text-base font-bold tracking-tight">Cookie Blocker</h2>
        </div>
        <div class="flex items-center gap-3">
          <button class="text-text-muted-dark hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-[20px]">help_outline</span>
          </button>
          <!-- <div class="h-8 w-8 rounded-full border border-border-defined overflow-hidden bg-slate-100">
            <img
              alt="Profile"
              class="w-full h-full object-cover"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1pMVYZDEo0SxiQcka4ogryE-_zRMB5LSV2p7htYR_rzRb5062rR0k3AYsZNf1oveAOWDbZQ6RBAebAVAD69y3UmnjDfgvFNRwzca81dTL3uySSdgfGkWrZ3TioE2-DyX0GM3O3VbdeuUNxB_Dw2S_QCbQ5SaSt1CPqPYtWq3-SYEebpm_3GLoW_6QQmPoWMVaob8WR8jqZFwhlkwyxSegwnFwR_AVLeiv6ubsBRyYLMBprpEbyAI2mhYWKR1X1qWPWXGa94azCQ"
            />
          </div> -->
        </div>
      </header>
      <main class="p-5 space-y-5">
        <div class="relative">
          <div id="refresh"
            class="px-5 pt-6 pb-6 mb-6 text-center bg-primary/5 dark:bg-primary/10 border-primary/10 rounded-xl"
          >
            <div
              class="inline-flex items-center justify-center w-10 h-10 bg-primary text-white rounded-full mb-4 shadow-lg shadow-primary/20"
            >
              <span class="material-symbols-outlined text-lg">refresh</span>
            </div>
            <h2 class="text-slate-900  text-lg font-bold leading-tight mb-2">
              Action Required
            </h2>
            <p class="text-slate-600 text-sm mb-5 px-4">
              Settings changed for
              <span class="font-medium text-slate-800" id="refresh-hostname">example.com</span>.
              Refresh page to apply changes.
            </p>
            <button
              class="w-full bg-primary hover:bg-primary/90 cursor-pointer text-base text-white py-2 px-3 rounded-lg flex items-center justify-center gap-2 transition-all shadow-md shadow-primary/25"
            >
              <span class="material-symbols-outlined">autorenew</span>
              <span>Refresh Now</span>
            </button>
          </div>
          <div
            class="relative flex flex-col items-start justify-between gap-4 rounded-xl border border-border-defined bg-white p-5 shadow-sm"
          >
            <div class="flex items-center justify-between w-full">
              <div class="flex flex-col gap-0.5">
                <span class="text-[10px] font-bold uppercase tracking-widest text-primary">Active Protection</span>
                <p id="protection-status" class="text-text-charcoal text-xl font-extrabold">Enabled</p>
              </div>
              <label
                class="relative flex h-[30px] w-[54px] cursor-pointer items-center rounded-full bg-slate-200 p-1 transition-colors has-[:checked]:bg-primary"
              >
                <input id="protection-toggle" checked="" class="sr-only peer" type="checkbox" />
                <div
                  class="h-5.5 w-5.5 rounded-full bg-white shadow-md transition-all peer-checked:translate-x-[24px]"
                ></div>
              </label>
            </div>
            <p id="protection-off-hint" class="text-text-muted-dark text-xs hidden">
              Protection is off. Turn on to block cookie banners.
            </p>
            <div
              id="stats-line-container"
              class="flex items-center gap-2.5 bg-badge-bg px-3 py-2.5 rounded-lg w-full border border-border-defined"
            >
              <span class="material-symbols-outlined text-primary text-[20px] font-bold">verified_user</span>
              <p id="stats-line" class="text-text-charcoal text-sm font-bold">—</p>
            </div>
          </div>
        </div>
        <div class="space-y-1">
          <h3 class="text-text-muted-dark text-[11px] font-extrabold uppercase tracking-widest px-1 pb-2">
            Settings &amp; Tools
          </h3>

          <button
            id="toggle"
            class="w-full flex items-center gap-4 px-3 py-3 rounded-lg bg-white border border-border-defined hover:border-primary/30 hover:bg-slate-50 transition-all group"
          >
            <div
              class="flex items-center justify-center rounded-lg bg-slate-100 text-text-charcoal size-10 group-hover:bg-blue-50 group-hover:text-primary transition-colors border border-border-defined"
            >
              <span class="material-symbols-outlined" id="toggle-icon">pause_circle</span>
            </div>
            <div class="flex flex-col items-start flex-1 overflow-hidden text-left">
              <p class="text-text-charcoal text-sm font-bold">Pause on this site</p>
              <p class="text-text-muted-dark text-xs truncate">Temporarily allow all cookies</p>
            </div>
            <span
              class="material-symbols-outlined text-text-muted-dark group-hover:text-primary text-[18px]"
              >chevron_right</span
            >
          </button>
          <button
            id="options"
            class="w-full flex items-center gap-4 px-3 py-3 rounded-lg bg-white border border-border-defined hover:border-primary/30 hover:bg-slate-50 transition-all group"
          >
            <div
              class="flex items-center justify-center rounded-lg bg-slate-100 text-text-charcoal size-10 group-hover:bg-blue-50 group-hover:text-primary transition-colors border border-border-defined"
            >
              <span class="material-symbols-outlined">settings</span>
            </div>
            <div class="flex flex-col items-start flex-1 overflow-hidden text-left">
              <p class="text-text-charcoal text-sm font-bold">Preferences</p>
              <p class="text-text-muted-dark text-xs truncate">Manage your block lists</p>
            </div>
            <span
              class="material-symbols-outlined text-text-muted-dark group-hover:text-primary text-[18px]"
              >chevron_right</span
            >
          </button>
          <!-- <button
            class="w-full flex items-center gap-4 px-3 py-3 rounded-lg bg-white border border-border-defined hover:border-primary/30 hover:bg-slate-50 transition-all group"
          >
            <div
              class="flex items-center justify-center rounded-lg bg-slate-100 text-text-charcoal size-10 group-hover:bg-blue-50 group-hover:text-primary transition-colors border border-border-defined"
            >
              <span class="material-symbols-outlined">flag</span>
            </div>
            <div class="flex flex-col items-start flex-1 overflow-hidden text-left">
              <p class="text-text-charcoal text-sm font-bold">Report Issue</p>
              <p class="text-text-muted-dark text-xs truncate">Site not working correctly?</p>
            </div>
            <span
              class="material-symbols-outlined text-text-muted-dark group-hover:text-primary text-[18px]"
              >chevron_right</span
            >
          </button> -->
        </div>
      </main>
      <footer
        class="px-5 py-4 bg-white border-t border-border-defined flex items-center justify-between"
      >
        <div class="flex items-center gap-2">
          <div id="footer-dot" class="size-2 rounded-full bg-emerald-600"></div>
          <span id="footer-status" class="text-text-charcoal text-[11px] font-bold uppercase tracking-tight"
            >System Ready</span
          >
        </div>
        <!-- <a
          class="text-primary hover:text-blue-800 text-[11px] font-extrabold uppercase tracking-wider transition-colors"
          href="#"
          >Upgrade to Pro</a
        > -->
      </footer>
    </div>

    <div id="menu_error" class="menu menu-hidden">
      <div style="text-align: center">
        <h2 data-translate="genericErrorTitle"></h2>
        <p data-translate="genericErrorTryAgain"></p>
        <a id="error_back_button" data-translate="genericErrorBack" class="menu-item"></a>
      </div>
    </div>

    <div id="menu_loading" class="menu menu-hidden">
      <div style="text-align: center">
        <img src="assets/spinner.svg" width="60" fill="#fff" alt="" />
        <p data-translate="menuLoadingText"></p>
      </div>
    </div>

    <script type="module" src="popup/index.js"></script>
  </body>
</html>
