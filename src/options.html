<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cookie Blocker Sidebar Settings</title>
    <link rel="stylesheet" href="options/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @layer base {
        body {
          font-family: 'Inter', sans-serif;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .dark body {
        background-color: #0f172a;
      }
      .custom-shadow {
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.04),
          0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body
    class="bg-bg-main dark:bg-slate-900 text-charcoal dark:text-slate-200 antialiased font-display"
  >
    <div
      class="flex h-screen w-full max-w-[400px] flex-col bg-bg-main dark:bg-slate-900 border-l border-border-custom dark:border-slate-700 shadow-sm overflow-hidden mx-auto md:mr-0"
    >
      <header
        class="flex items-center justify-between px-6 py-5 bg-white dark:bg-slate-800 border-b-2 border-border-custom dark:border-slate-700 shrink-0"
      >
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <img
              src="img/logo-128.png"
              alt="Cookie Blocker"
              width="24"
              height="24"
              class="shadow-sm"
            />
            <h1 class="text-lg font-bold tracking-tight text-charcoal dark:text-slate-100">
              Settings
            </h1>
          </div>
          <!-- <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em] mt-0.5">
            Cookie Blocker
          </p> -->
        </div>
        <div class="flex items-center gap-3">
          <label
            class="flex items-center gap-2 bg-bg-main dark:bg-surface-dark px-3 py-1.5 rounded-full border border-border-custom cursor-pointer"
            for="dark_mode"
          >
            <span
              class="text-[10px] font-bold text-charcoal dark:text-slate-200 uppercase tracking-tight"
              >Dark Mode</span
            >
            <div class="relative inline-flex items-center">
              <input
                id="dark_mode"
                type="checkbox"
                class="sr-only peer"
                aria-label="Toggle dark mode"
              />
              <div
                class="h-5 w-9 rounded-full bg-slate-300 peer-checked:bg-primary transition-colors duration-200 ease-in-out after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-transform after:duration-200 peer-checked:after:translate-x-4"
              ></div>
            </div>
          </label>
        </div>
      </header>
      <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <section
          class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-border-custom dark:border-slate-700 shadow-sm space-y-4"
        >
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-charcoal dark:text-slate-300 text-lg"
              >list_alt</span
            >
            <label
              class="text-xs font-bold text-charcoal dark:text-slate-200 uppercase tracking-widest"
              for="whitelist"
            >
              Whitelisted Websites
            </label>
          </div>
          <p class="text-[13px] text-slate-600 dark:text-slate-400 leading-relaxed">
            Add domains to bypass blocking. Enter one website per line.
          </p>
          <textarea
            class="w-full min-h-[140px] rounded-lg border-border-custom dark:border-slate-600 border bg-white dark:bg-slate-700 p-4 text-sm font-mono text-charcoal dark:text-slate-200 focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 resize-none"
            id="whitelist"
            placeholder="example.com
mytrustedsite.org"
          ></textarea>
        </section>
        <section
          id="default_action_label"
          class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-border-custom dark:border-slate-700 shadow-sm space-y-4"
        >
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-charcoal dark:text-slate-300 text-lg"
              >settings_suggest</span
            >
            <h3
              class="text-xs font-bold text-charcoal dark:text-slate-200 uppercase tracking-widest"
            >
              Auto-Dismiss Action
            </h3>
          </div>
          <div class="grid gap-3">
            <label
              class="group relative flex cursor-pointer items-start gap-3 rounded-lg border border-border-custom dark:border-slate-600 bg-white dark:bg-slate-700 p-4 transition-all hover:border-slate-300 dark:hover:border-slate-500 has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary"
            >
              <input
                checked=""
                id="default_action_reject"
                class="mt-1 h-4 w-4 border-border-custom dark:border-slate-500 text-primary focus:ring-primary focus:ring-offset-0"
                name="default_action"
                type="radio"
                value="reject"
              />
              <div class="flex flex-col gap-0.5">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-semibold text-charcoal dark:text-slate-200"
                    >Reject All</span
                  >
                  <span
                    class="rounded-full bg-primary/10 dark:bg-blue-900/40 px-2 py-0.5 text-[9px] font-bold text-primary dark:text-blue-100 uppercase"
                    >Recommended</span
                  >
                </div>
                <p class="text-[12px] text-slate-600 dark:text-slate-400 leading-normal">
                  Automatically decline non-essential cookies.
                </p>
              </div>
            </label>
            <label
              class="group relative flex cursor-pointer items-start gap-3 rounded-lg border border-border-custom dark:border-slate-600 bg-white dark:bg-slate-700 p-4 transition-all hover:border-slate-300 dark:hover:border-slate-500 has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary"
            >
              <input
                id="default_action_accept"
                value="accept"
                name="default_action"
                class="mt-1 h-4 w-4 border-border-custom dark:border-slate-500 text-primary focus:ring-primary focus:ring-offset-0"
                name="default_action"
                type="radio"
              />
              <div class="flex flex-col gap-0.5">
                <span class="text-sm font-semibold text-charcoal dark:text-slate-200"
                  >Accept All</span
                >
                <p class="text-[12px] text-slate-600 dark:text-slate-400 leading-normal">
                  Allow all cookies to be set for a seamless experience.
                </p>
              </div>
            </label>
          </div>
        </section>
        <section
          class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-border-custom dark:border-slate-700 shadow-sm"
        >
          <div class="flex items-center justify-between">
            <div class="flex flex-col gap-0.5">
              <label
                class="text-sm font-semibold text-charcoal dark:text-slate-200 flex items-center gap-1.5"
                for="status_indicators"
              >
                Status Indicators
                <span class="material-symbols-outlined text-slate-500 dark:text-slate-400 text-base"
                  >info</span
                >
              </label>
              <p class="text-[12px] text-slate-600 dark:text-slate-400">
                Show visual blocking status on the badge.
              </p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer" for="status_indicators">
              <input checked="" class="sr-only peer" id="status_indicators" type="checkbox" />
              <div
                class="w-10 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[3px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4.5 after:w-4.5 after:transition-all peer-checked:bg-primary"
              ></div>
            </label>
          </div>
        </section>
        <label> </label>
      </main>
      <div id="status_saved" style="display: none; color: green; padding-left: 5px"></div>
      <footer
        class="p-6 border-t-2 border-border-custom dark:border-slate-700 bg-white dark:bg-slate-800 shrink-0"
      >
        <button
          id="save"
          class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group active:scale-[0.98]"
        >
          <span class="material-symbols-outlined text-lg">save</span>
          Save Settings
        </button>
        <p
          class="text-center text-[9px] text-slate-500 dark:text-slate-400 mt-4 font-bold uppercase tracking-[0.2em]"
        >
          v1.2.13
        </p>
      </footer>
    </div>
    <script type="module" src="options/index.js"></script>
  </body>
</html>
