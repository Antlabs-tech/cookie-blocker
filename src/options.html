<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="options/index.css" />
    <style>
      body {
        padding: 20px;
      }
      label {
        display: block;
        width: 800px;
        padding: 0 0 20px;
      }
      textarea {
        width: 100%;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>

    <label>
      <span id="whitelist_label"></span><br />
      <textarea id="whitelist"></textarea>
    </label>

    <div style="padding: 0 0 20px">
      <span id="default_action_label"></span><br />

      <label style="margin-right: 10px; cursor: pointer;">
        <input type="radio" name="default_action" id="default_action_reject" value="reject" />
        <span id="default_action_reject_label"></span>
      </label>
      <label style="cursor: pointer;">
        <input type="radio" name="default_action" id="default_action_accept" value="accept" />
        <span id="default_action_accept_label"></span>
      </label>
    </div>

    <label>
      <input type="checkbox" id="status_indicators" />
      <span id="status_indicators_label"></span>
    </label>

    <input type="button" id="save" value="" style="min-width: 100px" />
    <div id="status_saved" style="display: none; color: green; padding-left: 5px"></div>

    <script type="module" src="options/index.js"></script>
  </body>
</html>
